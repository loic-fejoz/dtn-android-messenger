name: CI Verification

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  verify:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run MobSF Static Scan
        uses: MobSF/mobsfscan@1.2.0
        with:
          args: '. --type android -c .mobsf --sarif --output mobsf-results.sarif'

      - name: Upload MobSF Scan Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobsf-results
          path: mobsf-results.sarif
          if-no-files-found: warn

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Ktlint Check
        run: ./gradlew ktlintCheck

      - name: Run Detekt Analysis
        run: ./gradlew detekt

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-reports
          path: |
            build/reports/bom.json
            build/reports/bom.xml

